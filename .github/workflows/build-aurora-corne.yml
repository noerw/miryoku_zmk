name: 'Build Aurora Corne'
on: 
  - push
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["splitkb_aurora_corne_left","splitkb_aurora_corne_right"]'
      kconfig: '["CONFIG_ZMK_POINTING=y"]'
      alphas: '["qwerty"]'
      tap: '["qwerty"]'
      extra: '["colemakdh"]'
      nav: '["vi"]'
